<ul>
  @for (tab of tabs; track tab; let i = $index) {
    <li
      [class.active]="i === currentTab"
      (click)="onClickTab(tab)"
      (keydown.enter)="onClickTab(tab)"
      (keydown.space)="onClickTab(tab)"
      role="tab"
      [attr.tabindex]="i === currentTab ? 0 : -1"
      [attr.aria-selected]="i === currentTab"
      >
      <span>{{tab.name}}</span>
    </li>
  }
</ul>

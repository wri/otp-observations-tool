<div class="overlay" tabindex="-1" aria-hidden="true" (click)="closeable && close()"></div>

<div class="content" role="dialog" [attr.aria-label]="title" aria-hidden="true">
  @if (closeable) {
    <button type="button" class="close-button" [attr.aria-label]="'Close this dialog window' | translate" (click)="close()">&times;</button>
  }
  <div role="document">
    <ng-content></ng-content>
  </div>
</div>

<ul [class]="'-' + this.layout">
  @for (item of items; track item) {
    <li [class.-active]="isActive(item)">
      @if (item.url) {
        <a [routerLink]="item.url" (click)="onClick(item)">{{item.name}}</a>
      }
      @if (!item.url) {
        <button type="button" (click)="onClick(item)">{{item.name}}</button>
      }
    </li>
  }
</ul>

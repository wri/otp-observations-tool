env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  RAILS_ENV: e2e
  SECRET_KEY_BASE: f54c9d76c42e397e17cbc0d0a024da5a762a7a0d934839b417a77dac6fda65a49a37b32bcd229ac5fd5c1fedef8ed6acf7a57ed6465d6339862cdc0dfab8886f
  AUTH_SECRET: secret
  CONTACT_EMAIL: contact@example.com
  RESPONSIBLE_EMAIL: responsible@example.com
  FRONTEND_URL: http://localhost:4000
  OBSERVATIONS_TOOL_URL: http://localhost:4200
  CYPRESS_API_PATH: ../otp_api
  CYPRESS_RECORD_HAR: true
  ELECTRON_EXTRA_LAUNCH_ARGS: --remote-debugging-port=9222

name: Run tests

on: push

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Observation Tool Node Modules
        id: cache-portal-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Observation Tool Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Lint
        run: yarn lint

  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Observation Tool Node Modules
        id: cache-portal-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Observation Tool Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Build
        run: yarn prod-build

  test:
    name: E2E Tests
    runs-on: ubuntu-24.04

    strategy:
      # Without this, one failing shard cancels the others and their results are lost.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    services:
      redis:
        image: redis
        ports: ["6379:6379"]
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]

    steps:
      - name: Checkout Observation Tool
        uses: actions/checkout@v7

      - name: Checkout OTP API
        uses: actions/checkout@v7
        with:
          repository: wri/fti_api
          ref: master
          path: otp_api

      - name: Save OTP API Commit SHA
        id: otp_api_commit_sha
        working-directory: otp_api
        run: echo "VALUE=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install mjml
        run: npm install -g mjml@4

      - name: Read .nvmrc
        id: nvm
        run: echo "NVMRC=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nvm.outputs.NVMRC }}"

      - name: Cache Observation Tool Node Modules
        id: cache-portal-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ steps.nvm.outputs.NVMRC }}-${{ hashFiles('package.json', 'yarn.lock') }}

      - name: Install Observation Tool Dependencies
        run: yarn install --frozen-lockfile

      # Backgrounded so the Angular production build overlaps the API setup below
      # rather than running after it. Blocked on further down.
      - name: Start Observation Tool
        run: |
          nohup yarn start:e2e > /tmp/observation-tool.log 2>&1 &
          echo "observation tool building in background, pid $!"

      # The runner image points apt at azure.archive.ubuntu.com via a mirrorlist.
      # With three shards hitting it at once it intermittently stops answering and
      # apt burns minutes retrying before it falls back. Use the canonical archive.
      - name: Refresh apt index
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/Id' /etc/apt/apt-mirrors.txt
          fi
          # Stale lists resolve to versions the archive no longer carries, which 404s
          # on a cache miss.
          sudo apt-get update -qq

      # Bump `version` to rebuild the cache. The key also covers resolved package
      # versions, so upstream releases invalidate it on their own.
      # Nothing may apt-get install after this: the restore does not register the
      # packages with dpkg, so apt would consider all 156 of them missing.
      - name: Install API dependencies
        timeout-minutes: 8
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        env:
          DEBIAN_FRONTEND: noninteractive
        with:
          packages: build-essential libgdal-dev imagemagick
          version: "1"
          execute_install_scripts: true

      # gdal, rgeo and pg are compiled against the apt libraries, so the gem cache has
      # to follow the apt one. CACHE_KEY is the package-set hash the step above exports.
      - name: Setup API Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: otp_api
          cache-version: apt-${{ env.CACHE_KEY }}

      - name: Cache API Precompiled Assets
        id: cache-api-precompiled-assets
        uses: actions/cache@v6
        with:
          path: otp_api/public/assets
          key: api-precompiled-assets-${{ steps.otp_api_commit_sha.outputs.VALUE }}

      - name: Setup API
        working-directory: otp_api
        env:
          APP_URL: http://localhost:3000
        run: |
          bin/rails e2e:setup ${{ steps.cache-api-precompiled-assets.outputs.cache-hit == 'true' && 'SKIP_ASSETS_RESET=true' || '' }}

      - name: Run API Server
        working-directory: otp_api
        env:
          APP_URL: http://localhost:3000
        run: |
          bin/rails s > log/e2e.log 2>&1 &

      - name: Wait for Observation Tool
        timeout-minutes: 5
        run: |
          npx --yes wait-on -t 80000 http://localhost:4200 \
            || { echo '--- observation tool build log ---'; cat /tmp/observation-tool.log; exit 1; }


      # Cypress's ~800 MB binary lives in ~/.cache/Cypress and nothing cached it.
      - name: Cache E2E Dependencies
        id: cache-e2e-deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Cypress
            e2e/node_modules
          key: e2e-deps-${{ hashFiles('e2e/package.json', 'e2e/yarn.lock') }}

      - name: Install E2E Dependencies
        working-directory: e2e
        run: yarn install --frozen-lockfile

      - name: Run E2E Tests
        working-directory: e2e
        env:
          SPLIT: 3
          SPLIT_INDEX: ${{ matrix.shard }}
          # Balances shards by recorded spec duration; without it specs split by name
          # and quality-control.cy.js could land beside observations.cy.js.
          SPLIT_FILE: timings.json
        run: yarn cypress run

      - name: Uploading Test Artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-tests-artifacts-${{ matrix.shard }}
          path: |
            e2e/cypress/hars
            e2e/cypress/screenshots
            e2e/cypress/videos
            e2e/cypress/e2e/__image_snapshots__
            otp_api/log
